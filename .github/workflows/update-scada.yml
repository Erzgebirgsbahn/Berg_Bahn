name: Update SCADA Dashboard

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install matplotlib tzdata

      - name: Generate dashboard
        run: python scripts/generate_scada.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/scada.png assets/process_state.json
          git diff --staged --quiet || git commit -m "Update SCADA dashboard [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push
